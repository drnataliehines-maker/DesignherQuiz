<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DesignHer · Values Discovery Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f4ee;
      --surface: #ffffff;
      --ink: #263730;
      --muted: #66736c;
      --forest: #376253;
      --forest-dark: #294d40;
      --coral: #b96c56;
      --sage: #eaf0eb;
      --line: #e2e8e2;
      --shadow: 0 18px 55px rgba(39, 62, 51, .09);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; background: var(--paper); -webkit-font-smoothing: antialiased; }
    body { color: var(--ink); font-family: 'DM Sans', Arial, sans-serif; }
    #root { min-height: 100%; height: auto !important; }
    input, button { font: inherit; }
    input::placeholder { color: #89958e; opacity: 1; }
    input:focus { outline: none; border-color: var(--forest) !important; box-shadow: 0 0 0 4px rgba(55, 98, 83, .13) !important; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid rgba(55, 98, 83, .45) !important; outline-offset: 3px; }
    button:active { transform: translateY(1px); }
    ::selection { background: #d9e7dc; color: var(--ink); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #bdcbc1; border-radius: 8px; }

    .app-shell { min-height: 100vh !important; width: 100%; background: var(--paper) !important; color: var(--ink); }
    .brandbar { max-width: 1120px !important; padding: 23px 28px 18px !important; margin: 0 auto; border-bottom: 1px solid rgba(50, 78, 64, .10); }
    .brand-wordmark { color: var(--forest-dark) !important; font-family: 'DM Sans', sans-serif !important; font-style: normal !important; font-size: 21px !important; font-weight: 700 !important; letter-spacing: -.7px !important; }
    .brandbar span:last-child { color: var(--forest) !important; }
    .progress-shell { max-width: 1120px !important; padding: 18px 28px 0 !important; margin: 0 auto; }
    .progress-track { height: 8px !important; background: #e1e8e1 !important; border-radius: 999px !important; overflow: hidden; }
    .progress-fill { background: var(--forest) !important; border-radius: 999px !important; box-shadow: none !important; }
    .app-content { max-width: 1120px !important; padding: 0 28px; margin: 0 auto; }

    .welcome-screen {
      display: grid !important;
      grid-template-columns: minmax(0, 1.08fr) minmax(300px, .92fr);
      grid-template-rows: auto auto auto auto auto auto auto;
      gap: 14px 42px;
      align-items: start;
      text-align: left !important;
      width: 100% !important;
      max-width: 960px !important;
      padding: 48px 54px 52px !important;
      margin: 34px auto 60px !important;
      background: var(--surface);
      border: 1px solid rgba(53, 82, 67, .08);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }
    .welcome-screen > :nth-child(1) { grid-column: 1 / -1; justify-self: start; }
    .welcome-screen > :nth-child(2) { grid-column: 1; grid-row: 2; }
    .welcome-screen > :nth-child(3) { grid-column: 1; grid-row: 3; }
    .welcome-screen > :nth-child(4) { grid-column: 2; grid-row: 2 / span 5; align-self: stretch; }
    .welcome-screen > :nth-child(5) { grid-column: 1; grid-row: 4; }
    .welcome-screen > :nth-child(6) { grid-column: 1; grid-row: 5; }
    .welcome-screen > :nth-child(7) { grid-column: 1; grid-row: 6; }
    .welcome-screen > :nth-child(8) { grid-column: 1; grid-row: 7; }
    .eyebrow { background: #edf3ee !important; color: var(--forest) !important; font-size: 11px !important; letter-spacing: 1.5px !important; padding: 9px 13px !important; margin: 0 0 8px !important; }
    .welcome-screen h1 { font-family: 'Playfair Display', Georgia, serif !important; font-size: clamp(43px, 5vw, 62px) !important; font-weight: 400 !important; line-height: 1.04 !important; letter-spacing: -1.7px !important; color: var(--ink) !important; margin: 6px 0 8px !important; }
    .welcome-screen h1 em { color: var(--forest) !important; font-weight: 400 !important; }
    .welcome-intro { max-width: 510px; color: #58675f !important; font-size: 18px !important; line-height: 1.65 !important; margin: 0 0 12px !important; }
    .welcome-story { display: flex; flex-direction: column; justify-content: center; background: #f1f4ef !important; border: 1px solid #e5ebe4 !important; border-radius: 22px !important; padding: 29px 28px !important; margin: 0 !important; box-shadow: none !important; }
    .welcome-story p { color: #526159 !important; font-size: 16px !important; line-height: 1.72 !important; margin-bottom: 17px !important; }
    .welcome-story p:last-child { color: var(--forest-dark) !important; font-family: 'Playfair Display', Georgia, serif !important; font-size: 23px !important; line-height: 1.4 !important; margin: 8px 0 0 !important; }
    .welcome-feature { min-height: 54px; display: flex !important; align-items: center !important; gap: 13px !important; background: transparent !important; border: 0 !important; border-radius: 0 !important; border-top: 1px solid var(--line) !important; padding: 12px 2px !important; margin: 0 !important; }
    .welcome-feature > span:first-child { width: 28px; height: 28px; display: grid; place-items: center; background: #edf3ee; border-radius: 50%; color: var(--forest) !important; font-size: 14px !important; }
    .welcome-feature > span:last-child { color: #435249 !important; font-size: 15px !important; font-weight: 500 !important; }
    .primary-cta { background: var(--forest) !important; border-radius: 14px !important; box-shadow: 0 8px 20px rgba(41, 77, 64, .18) !important; color: #fff !important; font-size: 15px !important; letter-spacing: .2px !important; text-transform: none !important; padding: 17px 22px !important; margin-top: 7px !important; transition: background .2s, transform .2s, box-shadow .2s; }
    .primary-cta:hover { background: var(--forest-dark) !important; box-shadow: 0 10px 25px rgba(41, 77, 64, .24) !important; }

    .question-screen {
      max-width: 760px !important;
      width: 100%;
      min-height: 0 !important;
      justify-content: flex-start !important;
      padding: 32px 42px 40px !important;
      margin: 24px auto 60px;
      background: var(--surface);
      border: 1px solid rgba(53, 82, 67, .08);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .question-meta { margin-bottom: 24px !important; }
    .question-meta button { color: var(--forest) !important; font-size: 14px !important; font-weight: 600 !important; }
    .question-meta span { background: #edf3ee !important; color: var(--forest) !important; letter-spacing: 1px !important; }
    .question-title { font-family: 'Playfair Display', Georgia, serif !important; font-size: clamp(30px, 4vw, 39px) !important; font-weight: 400 !important; line-height: 1.18 !important; letter-spacing: -.65px !important; color: var(--ink) !important; margin-bottom: 27px !important; }
    .answer-list { gap: 12px !important; }
    .answer-option { min-height: 68px; padding: 18px 20px !important; background: #fff !important; border: 1.5px solid var(--line) !important; border-radius: 14px !important; color: #34443c !important; font-size: 17px !important; font-weight: 500 !important; line-height: 1.48 !important; box-shadow: 0 2px 5px rgba(40, 60, 49, .025) !important; transition: border-color .18s, background .18s, box-shadow .18s, transform .18s !important; }
    .answer-option:hover { border-color: #a6b9aa !important; background: #f8faf7 !important; box-shadow: 0 4px 14px rgba(40, 60, 49, .07) !important; transform: translateY(-1px); }
    .answer-option.is-selected { background: #edf3ee !important; border-color: var(--forest) !important; color: var(--forest-dark) !important; box-shadow: 0 0 0 2px rgba(55, 98, 83, .08) !important; }

    .email-screen, .results-screen { width: 100% !important; max-width: 760px !important; padding: 44px 48px !important; margin: 28px auto 60px !important; background: var(--surface); border: 1px solid rgba(53, 82, 67, .08); border-radius: 24px; box-shadow: var(--shadow); }
    .email-screen h2, .results-screen h2 { font-family: 'Playfair Display', Georgia, serif !important; font-weight: 400 !important; color: var(--ink) !important; }
    .email-screen h2 em { color: var(--forest) !important; }
    .email-screen strong { color: var(--forest) !important; }
    .email-icon { width: 68px; height: 68px; display: grid; place-items: center; margin: 0 auto 17px !important; border-radius: 50%; background: #edf3ee; color: var(--forest); font-size: 32px !important; }
    .email-screen input { min-height: 58px; padding: 15px 17px !important; background: #fbfcfa !important; border: 1.5px solid #dce4dc !important; border-radius: 12px !important; color: var(--ink) !important; font-size: 17px !important; }
    .email-screen input::placeholder { color: #7b8980; }
    .optin-card { border-color: #e3e9e3 !important; background: #f8faf7 !important; border-radius: 12px !important; }
    .email-screen > p:nth-of-type(3) { color: var(--muted) !important; }
    .email-submit { background: var(--forest) !important; border-radius: 13px !important; box-shadow: 0 8px 20px rgba(41, 77, 64, .18) !important; font-size: 15px !important; letter-spacing: .2px !important; text-transform: none !important; padding: 18px 20px !important; }
    .results-screen { max-width: 850px !important; text-align: left !important; }
    .results-kicker { color: var(--forest) !important; text-align: center !important; letter-spacing: 1.7px !important; }
    .archetype-card { border-radius: 20px !important; padding: 34px !important; box-shadow: none !important; }
    .value-card { border-radius: 14px !important; border-color: var(--line) !important; box-shadow: 0 2px 7px rgba(40, 60, 49, .04) !important; }
    .value-card-heading { font-family: 'Playfair Display', Georgia, serif !important; color: var(--ink) !important; }
    .workbook-card { background: #f1f4ef !important; border: 1px solid #e5ebe4 !important; border-radius: 18px !important; box-shadow: none !important; }
    .workbook-link { background: var(--forest) !important; border-radius: 12px !important; box-shadow: none !important; font-size: 14px !important; letter-spacing: .4px !important; }

    @media (max-width: 700px) {
      .brandbar { padding: 18px 20px 14px !important; }
      .progress-shell { padding: 14px 20px 0 !important; }
      .app-content { padding: 0 16px; }
      .welcome-screen { grid-template-columns: 1fr; grid-template-rows: auto; gap: 14px; padding: 30px 24px 28px !important; margin: 18px auto 35px !important; border-radius: 20px; }
      .welcome-screen > :nth-child(n) { grid-column: 1; grid-row: auto; }
      .welcome-screen > :nth-child(1) { margin-bottom: 1px !important; }
      .welcome-screen > :nth-child(4) { order: 8; }
      .welcome-screen > :nth-child(5) { order: 5; }
      .welcome-screen > :nth-child(6) { order: 6; }
      .welcome-screen > :nth-child(7) { order: 7; }
      .welcome-screen > :nth-child(8) { order: 4; }
      .welcome-screen h1 { font-size: clamp(42px, 12vw, 55px) !important; letter-spacing: -1.2px !important; }
      .welcome-intro { font-size: 16px !important; }
      .welcome-story { padding: 22px 21px !important; }
      .welcome-story p { font-size: 15px !important; margin-bottom: 12px !important; }
      .welcome-story p:last-child { font-size: 21px !important; }
      .welcome-feature { min-height: 48px; padding: 10px 1px !important; }
      .primary-cta { margin-top: 2px !important; }
      .question-screen { padding: 25px 21px 26px !important; margin: 16px auto 30px; border-radius: 19px; }
      .question-meta { margin-bottom: 20px !important; }
      .question-title { font-size: 30px !important; margin-bottom: 22px !important; }
      .answer-option { min-height: 62px; padding: 16px 16px !important; font-size: 16px !important; }
      .email-screen, .results-screen { padding: 32px 22px !important; margin: 18px auto 32px !important; border-radius: 19px; }
      .archetype-card { padding: 25px 20px !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect } = React;

  // ─── VALUES ──────────────────────────────────────────────────────────────────
  const VALUES = {
    Authenticity: { year:1, emoji:"✨", color:"#A85427", bg:"#FFF8E7", description:"Being fully yourself, with no performance and no shrinking, is a bold act. You are most powerful when you are most real.", alignment:"Deep trust in relationships, magnetic presence, energy that doesn't deplete because you're not maintaining a mask.", misalignment:"Suffocating in environments that reward performance over truth. Feeling unseen even in a crowd." },
    Legacy:       { year:1, emoji:"🏛️", color:"#6B4226", bg:"#FDF3EC", description:"Legacy is the answer to: What will remain when I'm gone? It is built in daily choices, not grand gestures.", alignment:"You make decisions with the long view in mind. You invest in people. You build things meant to outlast you.", misalignment:"So focused on leaving a mark that you miss the present. Or so present-focused that you never plant seeds." },
    Excellence:   { year:2, emoji:"💎", color:"#276B2E", bg:"#F1F8F2", description:"Mediocrity is not an option for you. Whatever is worth doing is worth doing with skill, care, and mastery.", alignment:"Your work reflects precision and pride. You elevate every room you're in. People count on you to deliver.", misalignment:"Perfectionism and burnout. Frustration with others' good enough. Rest feeling like falling behind." },
    Resilience:   { year:1, emoji:"🌊", color:"#1A5F8A", bg:"#EEF6FB", description:"You have an extraordinary capacity to absorb difficulty, adapt, and rise stronger. Setbacks are data, not defeat.", alignment:"You navigate change with grace. Your track record proves you don't stay down. Others draw strength from watching you rebuild.", misalignment:"Pushing through pain when rest is needed. Confusing relentless endurance with actual healing." },
    Courage:      { year:1, emoji:"🔥", color:"#A8301F", bg:"#FDF0EE", description:"Courage is not the absence of fear. It is choosing your truth, your growth, or someone else's freedom even when you are afraid.", alignment:"You speak up when it costs you something. You act before you feel ready. People draw strength from your nerve.", misalignment:"Confusing recklessness with bravery. Burning out from always being the one who steps up." },
    Ambition:     { year:2, emoji:"🚀", color:"#512A80", bg:"#F5F0FB", description:"You have a fire in you that won't be contained. You are driven to build, achieve, and create something that matters.", alignment:"You set audacious goals and pursue them relentlessly. You are energized by growth and momentum.", misalignment:"Restless in stagnant environments. Achievement becoming a substitute for actual fulfillment." },
    Leadership:   { year:1, emoji:"👑", color:"#6B328E", bg:"#F8F1FC", description:"You are drawn to guiding, inspiring, and mobilizing others. You set the vision instead of waiting for permission.", alignment:"You lead teams, mentor others, take initiative, and create environments where people feel seen and empowered.", misalignment:"Feeling stifled when micromanaged. Depleted when you're the only one carrying the vision forward." },
    "Self-Worth": { year:1, emoji:"💛", color:"#A85427", bg:"#FFF8E7", description:"Your value is not earned. It is inherent. Self-worth is the foundation everything else is built on.", alignment:"You make choices from worthiness, not fear. You don't settle in love, work, or life, because you know what you deserve.", misalignment:"Overworking to prove value. Staying in rooms, relationships, or roles that don't honor who you are." },
    Creativity:   { year:1, emoji:"🎨", color:"#B8440A", bg:"#FEF3EC", description:"Ideas flow through you in art, strategy, conversation, or design. Creative expression is a form of freedom.", alignment:"You thrive when given room to innovate, experiment, and make things beautiful. You're bored by the status quo.", misalignment:"Withering in rigid, repetitive environments. Work that doesn't allow invention drains your energy fast." },
    Joy:          { year:2, emoji:"☀️", color:"#A06800", bg:"#FFFBEF", description:"Joy runs deeper than happiness. It is a current that keeps flowing underneath your circumstances. Choosing joy is an act of resistance.", alignment:"You find delight in small things. Lightness is your natural state when you're living in alignment. You make rooms brighter.", misalignment:"Using busyness to avoid joy. Feeling guilty for having fun when so much needs to be done." },
    Boundaries:   { year:1, emoji:"🛡️", color:"#4A3878", bg:"#F4F1F9", description:"Boundaries are not walls. They are the edge of your self-respect. They teach others how to love you well.", alignment:"You protect your energy without guilt. Your relationships are honest and mutual because limits keep love healthy.", misalignment:"Chronic exhaustion from over-giving. Resentment building where boundaries were needed but never voiced." },
    Radiance:     { year:3, emoji:"🌟", color:"#A06800", bg:"#FFFBEF", description:"Radiance is what happens when you stop hiding. It's your natural light, freed from performance, fear, and the need to be palatable.", alignment:"Your presence is felt before you speak. You glow with the confidence of someone who has decided to take up space.", misalignment:"Dimming your light to make others comfortable. Or confusing radiance with performance and exhausting yourself." },
    Vulnerability:{ year:2, emoji:"💧", color:"#1050A0", bg:"#EEF4FC", description:"Vulnerability is not weakness. It is where connection, creativity, and courage begin. It takes strength to be seen.", alignment:"You form deep bonds quickly. People trust you because you trust them first. Your openness disarms walls.", misalignment:"Oversharing without discernment. Or sealing yourself off because someone weaponized your openness." },
    Wisdom:       { year:2, emoji:"🌙", color:"#141E6E", bg:"#EEEFFE", description:"You move from deep knowing, which is more than information. It is good judgment. You see patterns and offer perspective that transforms.", alignment:"People seek your counsel. You reflect before reacting. Your decisions are grounded in evidence and intuition.", misalignment:"Frustration when others won't slow down to think. Carrying the weight of seeing what others can't yet see." },
    Truth:        { year:3, emoji:"🪞", color:"#1A2A3A", bg:"#F0F2F4", description:"Truth is the closest relationship you will ever have, the one with yourself. Everything else is built on it.", alignment:"You name things as they are. Your word is trusted. You don't require agreement, only honesty.", misalignment:"Harsh truth without compassion. Or protecting others from truth in ways that ultimately harm them." },
    Service:      { year:2, emoji:"🕊️", color:"#206060", bg:"#EEF9F8", description:"Giving your time, wisdom, and gifts to lift others is what fuels you. Purpose lives in contribution.", alignment:"You are the person people call when they need real help. You find deep meaning in mentorship and advocacy.", misalignment:"Over-giving, neglecting your own needs. Attracting people who take without reciprocating." },
    Grace:        { year:3, emoji:"🌺", color:"#8A2820", bg:"#FDF0EE", description:"Grace is the quality of moving through life with ease, composure, and mercy, for yourself and for others.", alignment:"You extend patience where others rush to judgment. You handle difficulty with dignity. You are not easily rattled.", misalignment:"Grace becoming a mask for suppressed emotion. Performing composure while falling apart inside." },
    Freedom:      { year:2, emoji:"🦋", color:"#1A5F8A", bg:"#EEF6FB", description:"Autonomy is oxygen for you. You need space to think, move, decide, and live on your own terms.", alignment:"You thrive in flexible, self-directed environments. You are entrepreneurial, boundary-pushing, fiercely independent.", misalignment:"Rigid structures and controlling people feel suffocating. Commitment without choice feels like a trap." },
    Reinvention:  { year:3, emoji:"🦚", color:"#5A1878", bg:"#F6EEFB", description:"Reinvention is the courage to become someone new without abandoning who you've always been. It is evolution, not erasure.", alignment:"You shed outdated versions of yourself without grief. You embrace new chapters. Change is exciting, not threatening.", misalignment:"Reinventing to escape rather than to evolve. Or resisting change to protect an identity that no longer fits." },
    Vision:       { year:2, emoji:"🔭", color:"#005A4A", bg:"#EEF9F7", description:"You see what doesn't exist yet, and you believe in it enough to build toward it. Vision is the architecture of the future you're creating.", alignment:"You think long-term. You inspire others with the picture of what's possible. You plan with intention and flexibility.", misalignment:"Living so far in the future you miss the present. Or using vision as a substitute for execution." },
    Healing:      { year:3, emoji:"🌱", color:"#276B2E", bg:"#F1F8F2", description:"Healing is wholeness in progress. The past isn't erased. It gets woven in so it leaves you whole rather than broken.", alignment:"You have done the inner work. You respond rather than react. Your past informs but doesn't define your choices.", misalignment:"Wearing wounds as identity. Or bypassing genuine healing by staying perpetually busy or performing wellness." },
    Influence:    { year:3, emoji:"🌊", color:"#1050A0", bg:"#EEF4FC", description:"Influence is the ripple effect of your presence, and it travels further than you can see. The way you show up changes rooms.", alignment:"People are moved by your story. Your reputation precedes you in the best way. You lead without needing a title.", misalignment:"Chasing visibility for its own sake. Influence becoming performance instead of genuine contribution." },
    Purpose:      { year:1, emoji:"🌟", color:"#A06800", bg:"#FFFBEF", description:"You are not here by accident. Purpose is the thread that connects your gifts to the world's deepest needs.", alignment:"Your work feels meaningful even when it's hard. You return to your why during difficulty and it steadies you.", misalignment:"Busyness without direction. Achieving goals that don't satisfy because they were never truly yours." },
    Boldness:     { year:3, emoji:"🦁", color:"#A8301F", bg:"#FDF0EE", description:"Boldness is the willingness to be seen fully, loudly, and without apology. It is taking the risk of standing out.", alignment:"You pitch the audacious idea. You say the thing others avoid saying. You own the room.", misalignment:"Performing boldness for validation. Or being bold in safe contexts but shrinking where it actually costs something." },
    Celebration:  { year:3, emoji:"🥂", color:"#A85427", bg:"#FFF8E7", description:"Celebration is the practice of honoring how far you've come instead of waiting until you arrive. It is gratitude in motion.", alignment:"You mark milestones. You make space for joy after hard work. You celebrate others without diminishing yourself.", misalignment:"Moving the goalpost every time you arrive. Never pausing long enough to receive what you've earned." },
    Presence:     { year:3, emoji:"🕯️", color:"#4A3030", bg:"#F9F3F3", description:"Presence is the gift of being fully here, in your body, in this moment, in this conversation. It is increasingly rare and always remembered.", alignment:"People feel seen when they're with you. You're not half-distracted. Your attention is a form of love.", misalignment:"Chronic distraction, even from things you love. Living in past regret or future anxiety instead of right now." },
    Clarity:      { year:1, emoji:"🔮", color:"#206060", bg:"#EEF9F8", description:"Clarity is the luxury of truly knowing yourself: what you want, what you won't tolerate, and what matters most.", alignment:"You make decisions with confidence. Distractions don't derail you. You can say no easily because you know your yes.", misalignment:"Chronically overwhelmed by options. Saying yes to everything because you haven't named your priorities." },
    Discipline:   { year:2, emoji:"🎯", color:"#6E2A0A", bg:"#FDF3EC", description:"Discipline is devotion in practice, the daily choices that make your vision real. It is love for your future self.", alignment:"Your habits match your goals. You show up consistently, even without motivation. You trust the process.", misalignment:"Rigidity that leaves no room for grace. Or using discipline as a cover for fear of rest and play." },
    Power:        { year:2, emoji:"⚡", color:"#A8301F", bg:"#FDF0EE", description:"Power is your capacity to act, influence, and create change. Owning it without apology is one of the most radical things a woman can do.", alignment:"You take up space deliberately. You advocate for yourself and others. You don't dim your light for comfort.", misalignment:"Using power to control rather than elevate. Or giving your power away to avoid standing out." },
    Sovereignty:  { year:3, emoji:"🗝️", color:"#512A80", bg:"#F5F0FB", description:"Sovereignty is ruling your own life. It is the refusal to outsource your happiness, your decisions, or your sense of self to anyone else.", alignment:"You are the CEO of your life. You take full responsibility for your choices, your energy, your direction.", misalignment:"Rebellion without direction, where being contrarian stands in for sovereignty rather than genuinely self-governed." },

  // Scores every archetype against the FULL ranked list (not just the top 5), weighting
  // each match by how highly the user ranked it: rank 1 counts most, rank 10 counts least.
  // This makes ties much rarer than a flat overlap count; when one still occurs, the
  // archetype listed first above wins, same as before.
  function getArchetype(rankedValues) {
    let best = ARCHETYPES[0];
    let bestScore = -1;
    ARCHETYPES.forEach(arch => {
      const score = rankedValues.reduce((sum, v, i) => sum + (arch.values.includes(v) ? rankedValues.length - i : 0), 0);
      if (score > bestScore) { bestScore = score; best = arch; }
    });
    return best;
  }

  // Turns answers into a full ranked list of all 36 values.
  // Ties: more primary hits wins, then whichever value scored most recently.
  function scoreAnswers(answers) {
    const tally = {};
    Object.keys(VALUES).forEach((v,i)=>{ tally[v] = { pts:0, prim:0, last:-1, order:i }; });
    answers.forEach((ai, qi) => {
      if (ai === null || ai === undefined) return;
      const a = QUESTIONS[qi].answers[ai];
      if (tally[a.p]) { tally[a.p].pts += 2; tally[a.p].prim += 1; tally[a.p].last = qi; }
      if (tally[a.s]) { tally[a.s].pts += 1; tally[a.s].last = Math.max(tally[a.s].last, qi); }
    });
    return Object.keys(tally).sort((x,y)=>{
      const A=tally[x], B=tally[y];
      return (B.pts-A.pts) || (B.prim-A.prim) || (B.last-A.last) || (A.order-B.order);
    });
  }

  function shuffledOrders() {
    return QUESTIONS.map(q => {
      const idx = q.answers.map((_,i)=>i);
      for (let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
      return idx;
    });
  }

  // ─── PROGRESS PERSISTENCE (localStorage) ────────────────────────────────────────
  const PROGRESS_KEY = "designherQuizProgressV2";
  try { localStorage.removeItem("designherQuizProgress"); localStorage.removeItem("designherQuizRankState"); } catch {}

  function loadProgress() {
    try {
      const raw = localStorage.getItem(PROGRESS_KEY);
      const p = raw ? JSON.parse(raw) : null;
      if (!p || !Array.isArray(p.answers) || p.answers.length !== QUESTIONS.length) return null;
      return p;
    } catch { return null; }
  }
  function saveProgress(data) {
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); } catch {}
  }
  function clearProgress() {
    try { localStorage.removeItem(PROGRESS_KEY); } catch {}
  }

        <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:54,fontWeight:700,color:"#2A1B10",lineHeight:1.02,margin:"0 0 22px",letterSpacing:-0.5}}>A life that feels<br/><em style={{color:"#C2603A"}}>like yours.</em></h1>
        <p className="welcome-intro" style={{fontFamily:"'DM Sans',sans-serif",fontSize:18,color:"rgba(42,27,16,0.82)",lineHeight:1.65,marginBottom:34}}>

        <div className="welcome-story" style={{textAlign:"left",background:"#fff",border:"1px solid rgba(194,96,58,0.18)",borderRadius:18,padding:"22px 20px",marginBottom:30,boxShadow:"0 2px 10px rgba(168,68,31,0.06)"}}>
          <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:16,lineHeight:1.65,color:"rgba(42,27,16,0.85)",marginBottom:14}}>

          <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:16,lineHeight:1.65,color:"rgba(42,27,16,0.85)",marginBottom:14}}>

          <p style={{fontFamily:"'Playfair Display',serif",fontSize:19,fontStyle:"italic",lineHeight:1.45,color:"#A8441F",margin:0}}>
            Your values are a good place to begin.
          </p>
        </div>
        {[["✦","21 questions, about 5 minutes"],["✦","Real-life scenarios and quick this-or-that picks"],["✦","No right or wrong answers"]].map(([i,t])=>(
          <div key={t} className="welcome-feature" style={{display:"flex",gap:13,alignItems:"center",marginBottom:11,textAlign:"left",background:"#fff",border:"1px solid rgba(194,96,58,0.18)",borderRadius:14,padding:"13px 16px"}}>

  // ─── EMAIL ───────────────────────────────────────────────────────────────────
  function EmailScreen({ onSubmit }) {
    const [email,setEmail]=useState("");
    const [name,setName]=useState("");
    const [error,setError]=useState("");
    const [optIn,setOptIn]=useState(false);

    const submit=()=>{
      if(!name.trim()){setError("Please enter your first name.");return;}
      if(!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)){setError("Please enter a valid email.");return;}
      // optIn=true  → subscribe to Kit (launches, new workbooks, updates)
      // optIn=false → results delivery only, do NOT add to Kit marketing list
      onSubmit({name:name.trim(), email:email.trim(), optIn});
    };

    const inp={width:"100%",padding:"16px 18px",background:"#fff",border:"1.5px solid rgba(139,105,20,0.28)",borderRadius:14,fontFamily:"'DM Sans',sans-serif",fontSize:18,color:"#2A1B10",boxSizing:"border-box",marginBottom:14};

    return (
      <div className="email-screen" style={{textAlign:"center",padding:"44px 32px",maxWidth:400,margin:"0 auto"}}>
        <div className="email-icon" aria-hidden="true" style={{fontSize:52,marginBottom:16}}>✦</div>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:38,fontWeight:700,color:"#2A1B10",lineHeight:1.15,marginBottom:14}}>Your Archetype<br/><em style={{color:"#A85427"}}>Awaits.</em></h2>
        <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:19,color:"rgba(42,27,16,0.8)",marginBottom:8,lineHeight:1.5}}>You answered all <strong style={{color:"#A85427"}}>21 questions</strong>.</p>
        <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:16,color:"rgba(42,27,16,0.66)",marginBottom:28,lineHeight:1.5}}>Enter your details to reveal your season archetype, your 5 core values, and what they mean for your life right now.</p>

        <input aria-label="First name" autoComplete="given-name" value={name} onChange={e=>{setName(e.target.value);setError("");}} placeholder="First name" style={inp}/>
        <input aria-label="Email address" autoComplete="email" value={email} onChange={e=>{setEmail(e.target.value);setError("");}} placeholder="Email address" type="email" style={inp}/>

        <div className="optin-card" role="checkbox" aria-checked={optIn} tabIndex={0}
          onKeyDown={e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();setOptIn(p=>!p);}}}
          onClick={()=>setOptIn(p=>!p)}
          style={{display:"flex",alignItems:"flex-start",gap:12,textAlign:"left",cursor:"pointer",
            background:optIn?"#FFF8E7":"#fff",
            border:"1.5px solid "+(optIn?"rgba(139,105,20,0.4)":"rgba(26,18,8,0.1)"),
            borderRadius:12,padding:"14px 16px",marginBottom:8,transition:"all 0.2s"}}>
          <div style={{width:22,height:22,borderRadius:6,
            border:"2px solid "+(optIn?"#A85427":"rgba(26,18,8,0.2)"),
            background:optIn?"#A85427":"#fff",flexShrink:0,marginTop:1,
            display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.2s"}}>
            {optIn&&<span style={{color:"#fff",fontSize:13,fontWeight:700,lineHeight:1}}>✓</span>}
          </div>
          <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:15,color:"rgba(42,27,16,0.82)",lineHeight:1.55,margin:0}}>
            Yes, keep me posted on new DesignHer workbooks, launches, and updates.
          </p>
        </div>

        <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,color:"rgba(26,18,8,0.38)",marginBottom:24,textAlign:"left",lineHeight:1.5,paddingLeft:2}}>
          Leave unchecked to receive your results only. You can subscribe anytime at designher.co.
        </p>

        {error&&<p role="alert" style={{color:"#A8301F",fontFamily:"'DM Sans',sans-serif",fontSize:15,marginBottom:12}}>{error}</p>}
        <button className="email-submit" onClick={submit} style={{width:"100%",padding:"20px 0",background:"linear-gradient(135deg,#B5761F 0%,#C2603A 100%)",border:"none",borderRadius:18,fontFamily:"'DM Sans',sans-serif",fontSize:16,letterSpacing:1.6,textTransform:"uppercase",color:"#fff",fontWeight:700,cursor:"pointer",boxShadow:"0 10px 26px rgba(194,96,58,0.32)"}}>Reveal My Archetype</button>
      </div>
    );
  }

  // ─── VALUE CARD (results) ─────────────────────────────────────────────────────
  function ValueCard({ valueName, index, expanded, onToggle }) {
    const v = VALUES[valueName]; if(!v) return null;
    const yearLabel = ["Foundation","Expansion","Mastery"][v.year-1];
    return (
      <div className="value-card" role="button" tabIndex={0} aria-expanded={expanded}
        onKeyDown={e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();onToggle();}}}
        onClick={onToggle} style={{background:expanded?v.bg:"#fff",border:`1.5px solid ${expanded?v.color+"45":"rgba(26,18,8,0.07)"}`,borderRadius:18,marginBottom:12,cursor:"pointer",overflow:"hidden",transition:"all 0.3s",boxShadow:expanded?"0 4px 20px rgba(0,0,0,0.07)":"0 2px 8px rgba(0,0,0,0.04)"}}>
        <div style={{display:"flex",alignItems:"center",gap:16,padding:"18px 20px"}}>
          <div style={{width:52,height:52,borderRadius:"50%",background:v.bg,border:`2px solid ${v.color}35`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{v.emoji}</div>
          <div style={{flex:1}}>
            <div className="value-card-heading" style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:"#2A1B10",fontWeight:700}}>{valueName}</div>
            <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:12,letterSpacing:2,textTransform:"uppercase",color:v.color,marginTop:2}}>{yearLabel} · #{index+1}</div>
          </div>
          <div style={{color:"rgba(26,18,8,0.28)",fontSize:18,transition:"transform 0.3s",transform:expanded?"rotate(180deg)":"none"}}>▾</div>
        </div>
        {expanded&&(
          <div style={{padding:"0 20px 20px",borderTop:`1px solid ${v.color}18`}}>
            <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:18,color:"rgba(26,18,8,0.72)",lineHeight:1.7,marginBottom:16,marginTop:16}}>{v.description}</p>
            <div style={{background:"#fff",borderLeft:`4px solid ${v.color}`,borderRadius:"0 10px 10px 0",padding:"14px 16px",marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,0.04)"}}>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,letterSpacing:2,textTransform:"uppercase",color:v.color,marginBottom:6,fontWeight:600}}>✦ In Alignment</div>
              <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:17,color:"rgba(26,18,8,0.62)",lineHeight:1.65,margin:0}}>{v.alignment}</p>
            </div>
            <div style={{background:"#fff",borderLeft:"4px solid rgba(168,48,31,0.45)",borderRadius:"0 10px 10px 0",padding:"14px 16px",boxShadow:"0 2px 8px rgba(0,0,0,0.04)"}}>
              <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:11,letterSpacing:2,textTransform:"uppercase",color:"rgba(168,48,31,0.65)",marginBottom:6,fontWeight:600}}>⚡ Out of Alignment</div>
              <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:17,color:"rgba(42,27,16,0.8)",lineHeight:1.65,margin:0}}>{v.misalignment}</p>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ─── RESULTS ──────────────────────────────────────────────────────────────────
  function ConfirmationScreen({ userName, archetype, topValues, onRestart }) {
    const [expandedIndex, setExpandedIndex] = useState(null);
    return (
      <div className="results-screen" style={{padding:"36px 22px",maxWidth:440,margin:"0 auto",textAlign:"center"}}>
        <div className="results-kicker" style={{fontSize:12,letterSpacing:4,textTransform:"uppercase",color:"#A85427",fontFamily:"'DM Sans',sans-serif",marginBottom:14}}>{userName.split(" ")[0]}'s Results</div>

        <div className="archetype-card" style={{background:archetype.bg,border:`1.5px solid ${archetype.color}35`,borderRadius:22,padding:"30px 24px",marginBottom:28,boxShadow:"0 4px 20px rgba(0,0,0,0.05)"}}>
          <div style={{fontSize:42,marginBottom:10}}>{archetype.emoji}</div>
          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:28,fontWeight:700,color:archetype.color,lineHeight:1.15,margin:"0 0 8px"}}>{archetype.name}</h2>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontStyle:"italic",fontSize:16,color:"rgba(42,27,16,0.78)",marginBottom:14}}>{archetype.season}</div>
          <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:17,color:"rgba(42,27,16,0.82)",lineHeight:1.65,margin:0}}>{archetype.description}</p>
        </div>

        <div style={{textAlign:"left",marginBottom:28}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,color:"#2A1B10",marginBottom:14,textAlign:"center"}}>Your 5 Core Values</div>
          {topValues.map((name,i)=>(
            <ValueCard key={name} valueName={name} index={i} expanded={expandedIndex===i} onToggle={()=>setExpandedIndex(p=>p===i?null:i)}/>
          ))}
        </div>

        <div style={{background:"linear-gradient(135deg,#FFF8E7,#FFFDF8)",border:"1.5px solid rgba(139,105,20,0.22)",borderRadius:20,padding:"26px",marginBottom:28,boxShadow:"0 4px 20px rgba(139,105,20,0.07)"}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,color:"#2A1B10",fontWeight:700,marginBottom:10}}>Want to keep this?</div>
          <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:17,color:"rgba(26,18,8,0.52)",lineHeight:1.65,margin:"0 0 8px"}}>
            We're also sending your archetype and values to your inbox. If you don't see it in a few minutes, check your spam or promotions folder.
          </p>
        </div>
        <div className="workbook-card" style={{background:"linear-gradient(135deg,#FFF8E7,#FFFDF8)",border:"1.5px solid rgba(139,105,20,0.22)",borderRadius:20,padding:"26px",textAlign:"center",marginBottom:28,boxShadow:"0 4px 20px rgba(139,105,20,0.07)"}}>
          <div style={{fontSize:32,marginBottom:12}}>📖</div>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:"#2A1B10",fontWeight:700,marginBottom:10}}>Go Deeper with DesignHer</div>
          <p style={{fontFamily:"'DM Sans',sans-serif",fontSize:17,color:"rgba(26,18,8,0.52)",lineHeight:1.65,margin:"0 0 18px"}}>The Activate Workbooks walk you through each value and help you move from knowing your values to living them.</p>
           <a className="workbook-link" href="https://designher.co" target="_blank" rel="noopener noreferrer" style={{display:"block",padding:"16px 0",background:"linear-gradient(135deg,#B5761F 0%,#C2603A 100%)",borderRadius:14,fontFamily:"'DM Sans',sans-serif",fontSize:16,letterSpacing:3,textTransform:"uppercase",color:"#fff",fontWeight:700,textDecoration:"none",boxShadow:"0 6px 24px rgba(139,105,20,0.28)"}}>Browse the Workbooks →</a>
        </div>
        <div style={{textAlign:"center"}}>
          <button onClick={onRestart} style={{background:"transparent",border:"1.5px solid rgba(26,18,8,0.14)",borderRadius:12,padding:"12px 24px",fontFamily:"'DM Sans',sans-serif",fontSize:14,letterSpacing:2,textTransform:"uppercase",color:"rgba(26,18,8,0.38)",cursor:"pointer"}}>Retake Quiz</button>
        </div>
      </div>
    );
  }

  // ─── APP ──────────────────────────────────────────────────────────────────────
  function DesignHerQuiz() {
    const saved = loadProgress();
    const [phase, setPhase]         = useState(()=> saved && ["questions","email"].includes(saved.phase) ? saved.phase : "welcome");
    const [answers, setAnswers]     = useState(()=> saved?.answers || Array(QUESTIONS.length).fill(null));
    const [qIndex, setQIndex]       = useState(()=> saved?.qIndex || 0);
    const [orders, setOrders]       = useState(()=> saved?.orders || shuffledOrders());
    const [userData, setUserData]   = useState(null);
    const [topValues, setTopValues] = useState([]);
    const [archetype, setArchetype] = useState(null);

    // Persist enough to survive a refresh mid-quiz.
    useEffect(()=>{
      if (phase==="questions" || phase==="email") saveProgress({ phase, answers, qIndex, orders });
    },[phase, answers, qIndex, orders]);

    useEffect(()=>{ window.scrollTo(0,0); },[phase, qIndex]);

    const handleStart = () => {
      setAnswers(Array(QUESTIONS.length).fill(null));
      setOrders(shuffledOrders());
      setQIndex(0);
      setPhase("questions");
    };

    const handleAnswer = (ai) => {
      const next = answers.slice(); next[qIndex] = ai;
      setAnswers(next);
      if (qIndex < QUESTIONS.length-1) setQIndex(qIndex+1);
      else setPhase("email");
    };

    const handleBack = () => { if (qIndex>0) setQIndex(qIndex-1); };

    const handleEmailSubmit = ({name,email,optIn}) => {
      const ranked = scoreAnswers(answers);
      const tv = ranked.slice(0,5);
      const arch = getArchetype(ranked.slice(0,10));

      // ── Send subscriber to Kit form 9773625 ──
      const kitData = new FormData();
      kitData.append("email_address", email);
      kitData.append("fields[first_name]", name);
      kitData.append("fields[archetype]", arch.name);
      kitData.append("fields[top_value_1]", tv[0] || "");
      kitData.append("fields[top_value_2]", tv[1] || "");
      kitData.append("fields[top_value_3]", tv[2] || "");
      kitData.append("fields[top_value_4]", tv[3] || "");
      kitData.append("fields[top_value_5]", tv[4] || "");
      kitData.append("fields[marketing_optin]", optIn ? "yes" : "no");

      fetch("https://app.kit.com/forms/9773625/subscriptions", {
        method: "POST",
        body: kitData,
      }).catch(err => console.log("Kit submission error:", err));

      clearProgress();
      setUserData({name,email,optIn});
      setTopValues(tv);
      setArchetype(arch);
      setPhase("confirmation");
    };

    const handleRestart = () => {
      clearProgress();
      setAnswers(Array(QUESTIONS.length).fill(null)); setQIndex(0); setOrders(shuffledOrders());
      setUserData(null); setTopValues([]); setArchetype(null);
      setPhase("welcome");
    };

    const progress = phase==="questions" ? ((qIndex+1)/QUESTIONS.length)*100 : 0;

    return (
      <div className="app-shell" style={{minHeight:"100vh",background:"transparent",display:"flex",flexDirection:"column",alignItems:"center",overflowY:"auto"}}>
        {/* Header */}
        <div className="brandbar" style={{width:"100%",maxWidth:440,padding:"20px 24px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span className="brand-wordmark" style={{fontFamily:"'Playfair Display',serif",fontStyle:"italic",fontWeight:700,fontSize:19,color:"#C2603A",letterSpacing:0.5}}>DesignHer<span aria-hidden="true" style={{color:"#b96c56",fontSize:22}}>·</span></span>
          {phase==="questions"&&<span style={{fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:700,color:"#A8441F",letterSpacing:0.8}}>{qIndex+1} of {QUESTIONS.length}</span>}
        </div>

        {phase==="questions"&&(
          <div className="progress-shell" aria-label={`Question ${qIndex+1} of ${QUESTIONS.length}`} style={{width:"100%",maxWidth:440,padding:"10px 24px 0"}}>
            <div className="progress-track" style={{height:7,background:"rgba(168,68,31,0.13)",borderRadius:99}}>
              <div className="progress-fill" style={{height:"100%",width:`${progress}%`,background:"linear-gradient(90deg,#B5761F,#C2603A)",borderRadius:99,transition:"width 0.35s ease",boxShadow:"0 2px 8px rgba(194,96,58,0.35)"}}/>
            </div>
          </div>
        )}

        <div className="app-content" style={{flex:1,width:"100%",maxWidth:440,display:"flex",flexDirection:"column"}}>
          {phase==="welcome" && <WelcomeScreen onStart={handleStart}/>}

          {phase==="questions" &&
            <QuestionScreen qIndex={qIndex} order={orders[qIndex]} chosen={answers[qIndex]} onAnswer={handleAnswer} onBack={handleBack}/>}

          {phase==="email" && <EmailScreen onSubmit={handleEmailSubmit}/>}
          {phase==="confirmation" && userData && archetype &&
            <ConfirmationScreen userName={userData.name} archetype={archetype} topValues={topValues} onRestart={handleRestart}/>}
        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<DesignHerQuiz/>);
</script>
</body>
</html>
